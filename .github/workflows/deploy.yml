name: Build and Deploy Flutter Projects

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build all Flutter projects
        run: |
          mkdir -p _site
          shopt -s nullglob

          REPO_NAME="${{ github.event.repository.name }}"

          # Membuat halaman menu utama agar mudah memilih kedua link
          cat <<EOF > _site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Daftar Proyek Flutter - $REPO_NAME</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; }
              h1 { color: #333; }
              .card { display: block; background: white; padding: 15px 20px; margin: 10px 0; border-radius: 8px; text-decoration: none; color: #02569B; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
              .card:hover { background: #02569B; color: white; }
            </style>
          </head>
          <body>
            <h1>Daftar Proyek Pemrograman Mobile</h1>
          EOF

          for pubspec in */pubspec.yaml; do
            project="${pubspec%/pubspec.yaml}"

            if [ ! -d "$project/web" ]; then
              echo "Skipping $project (no web folder)"
              continue
            fi

            echo "Building $project..."

            (
              set -e
              cd "$project"
              flutter pub get
              flutter build web --release \
                --base-href "/${REPO_NAME}/${project}/"
            )

            mkdir -p "_site/$project"
            cp -R "$project/build/web/." "_site/$project/"

            # Menambahkan tombol link untuk anime_verse dan pemob_api
            echo "<a class='card' href='./$project/'>📱 Buka Proyek: $project</a>" >> _site/index.html

            echo "$project successfully built!"
          done

          echo "</body></html>" >> _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == format(
        'refs/heads/{0}',
        github.event.repository.default_branch
      )
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
