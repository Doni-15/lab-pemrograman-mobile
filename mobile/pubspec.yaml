name: anime_verse
description: "A new Flutter project."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/logos/
    - assets/images/placeholders/
    - assets/images/posters/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus-jakarta-400.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta-700.ttf
          weight: 700

flutter_native_splash:
  color: "#0B1120"
  image: assets/images/logos/anime_splash_logo.png

  android: true
  ios: false
  web: false

  android_gravity: center
  fullscreen: true

  android_12:
    color: "#0B1120"
    image: assets/images/logos/anime_splash_logo.png
    icon_background_color: "#0B1120"
